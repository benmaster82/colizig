      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#F7A41D"/>
    </linearGradient>
  </defs>

  <!-- pixel-art hummingbird, same 17x10 sprite/palette as the `chat` REPL banner -->
  <g stroke="rgba(0,0,0,0.18)" stroke-width="1">
    <rect x="76"  y="20"  width="42" height="14" fill="#AD96FF"/>
    <rect x="62"  y="34"  width="70" height="14" fill="#AD96FF"/>
    <rect x="160" y="34"  width="14" height="14" fill="#F7A41D"/>
    <rect x="76"  y="48"  width="56" height="14" fill="#AD96FF"/>
    <rect x="146" y="48"  width="28" height="14" fill="#F7A41D"/>
    <rect x="20"  y="62"  width="56" height="14" fill="#FFBE46"/>
    <rect x="76"  y="62"  width="28" height="14" fill="#785AEB"/>
    <rect x="104" y="62"  width="14" height="14" fill="#EBEBF5"/>
    <rect x="118" y="62"  width="14" height="14" fill="#785AEB"/>
    <rect x="132" y="62"  width="28" height="14" fill="#F7A41D"/>
    <rect x="76"  y="76"  width="70" height="14" fill="#785AEB"/>
    <rect x="146" y="76"  width="28" height="14" fill="#F7A41D"/>
    <rect x="90"  y="90"  width="56" height="14" fill="#785AEB"/>
