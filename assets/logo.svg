    <rect x="104" y="104" width="28" height="14" fill="#785AEB"/>
    <rect x="132" y="104" width="28" height="14" fill="#F7A41D"/>
    <rect x="118" y="118" width="14" height="14" fill="#785AEB"/>
    <rect x="132" y="118" width="14" height="14" fill="#F7A41D"/>
    <rect x="132" y="132" width="14" height="14" fill="#F7A41D"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="200" y="100" font-family="Consolas, 'SF Mono', 'Cascadia Code', Menlo, monospace"
        font-weight="700" font-size="56" letter-spacing="1" fill="url(#wordmark)">colizig</text>
  <text x="202" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" font-style="italic" fill="#8F8F9C">stream MoE checkpoints bigger than your RAM</text>
